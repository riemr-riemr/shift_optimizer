<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
  <meta charset="UTF-8" />
  <title>画面権限管理</title>
</head>
<body>
<div layout:fragment="content">
  <div th:replace="~{fragments/page-header :: page-header('bi bi-shield-lock', '画面権限管理', '役割ごとに各画面の参照・更新権限を設定します')}"></div>

  <div class="card mb-4">
    <div class="card-header">権限マスタ作成・編集</div>
    <div class="card-body">
      <form method="post" th:action="@{/permissions/roles/create}" class="row g-3 align-items-end mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="col-md-3">
          <label for="authorityCode" class="form-label">権限コード</label>
          <input id="authorityCode" name="authorityCode" class="form-control" maxlength="20" placeholder="例: SUPERVISOR" required />
        </div>
        <div class="col-md-3">
          <label for="authorityName" class="form-label">権限名</label>
          <input id="authorityName" name="authorityName" class="form-control" maxlength="50" placeholder="例: 副店長" required />
        </div>
        <div class="col-md-2">
          <label for="authorityLevel" class="form-label">権限レベル</label>
          <input id="authorityLevel" name="authorityLevel" type="number" min="0" max="99" class="form-control" placeholder="00-99" required />
        </div>
        <div class="col-md-2">
          <label for="description" class="form-label">説明</label>
          <input id="description" name="description" class="form-control" placeholder="必要に応じて入力" />
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-outline-primary"><i class="bi bi-plus-circle"></i> 追加</button>
        </div>
      </form>

      <form method="post" th:action="@{/permissions/roles/update}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 18%;">権限コード</th>
                <th style="width: 22%;">権限名</th>
                <th style="width: 14%;">レベル</th>
                <th>説明</th>
                <th style="width: 80px;"></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${roles}">
                <td class="fw-semibold" th:text="${r.authorityCode}">ADMIN</td>
                <td>
                  <input class="form-control form-control-sm" maxlength="50" required
                         th:name="${r.authorityCode + '|name'}"
                         th:value="${r.authorityName}" />
                </td>
                <td>
                  <input class="form-control form-control-sm text-end" type="number" min="0" max="99" required
                         th:name="${r.authorityCode + '|level'}"
                         th:value="${r.authorityLevel}" />
                </td>
                <td>
                  <input class="form-control form-control-sm"
                         th:name="${r.authorityCode + '|description'}"
                         th:value="${r.description}" />
                </td>
                <td>
                  <form method="post" th:action="@{/permissions/roles/delete}"
                        th:data-authority-code="${r.authorityCode}"
                        onsubmit="return confirm('権限コード ' + this.dataset.authorityCode + ' を削除してよいですか？')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="authorityCode" th:value="${r.authorityCode}" />
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-end mt-3">
          <button type="submit" class="btn btn-outline-secondary">権限マスタを更新</button>
        </div>
      </form>
      <p class="text-muted small mb-0 mt-2">既存の権限コードは外部キー連携のため変更できません。</p>
    </div>
  </div>

  <form method="post" th:action="@{/permissions}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="card mb-4">
      <div class="card-header">画面権限マトリクス</div>
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>画面コード</th>
              <th th:each="r : ${roles}" th:text="${r.authorityCode}">ROLE</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="screen : ${screens}">
              <td>
                <div class="fw-semibold" th:text="${T(io.github.riemr.shift.util.ScreenCodes).NAMES.get(screen)}">画面名</div>
              </td>
              <td th:each="r : ${roles}">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox"
                         th:name="${r.authorityCode + '|' + screen + '|view'}"
                         th:checked="${perm[r.authorityCode] != null and perm[r.authorityCode].get(screen) != null and perm[r.authorityCode].get(screen).canView == true}">
                  <label class="form-check-label">参照</label>
                </div>
                <div class="form-check form-check-inline ms-3">
                  <input class="form-check-input" type="checkbox"
                         th:name="${r.authorityCode + '|' + screen + '|update'}"
                         th:checked="${perm[r.authorityCode] != null and perm[r.authorityCode].get(screen) != null and perm[r.authorityCode].get(screen).canUpdate == true}">
                  <label class="form-check-label">更新</label>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">部門閲覧権限マトリクス</div>
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>部門</th>
              <th th:each="r : ${roles}" th:text="${r.authorityCode}">ROLE</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="d : ${departments}">
              <td>
                <div class="fw-semibold" th:text="${d.departmentCode}">520</div>
                <div class="text-muted small" th:text="${d.departmentName}">Register</div>
              </td>
              <td th:each="r : ${roles}">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox"
                         th:name="${r.authorityCode + '|DEPT|' + d.departmentCode}"
                         th:checked="${deptPerm[r.authorityCode] != null and deptPerm[r.authorityCode].get(d.departmentCode) != null and deptPerm[r.authorityCode].get(d.departmentCode) == true}">
                  <label class="form-check-label">閲覧可</label>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-end">
        <span class="text-muted small">部門単位の閲覧可否</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">店舗権限（組織ノード単位）</div>
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
          <tr>
            <th>組織ノード</th>
            <th th:each="r : ${roles}" th:text="${r.authorityCode}">ROLE</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="n : ${orgNodes}">
            <td>
              <div class="fw-semibold" th:text="${n.nodeCode}" th:style="|margin-left:${(n.hierarchyLevel != null ? n.hierarchyLevel : 0) * 16}px;|">ROOT</div>
              <div class="text-muted small" th:text="${n.nodeName}">全社</div>
            </td>
            <td th:each="r : ${roles}">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"
                       th:name="${r.authorityCode + '|NODE|' + n.nodeId + '|view'}"
                       th:checked="${nodePerm[r.authorityCode] != null and nodePerm[r.authorityCode].get(n.nodeId) != null and nodePerm[r.authorityCode].get(n.nodeId).canViewStore == true}">
                <label class="form-check-label">参照</label>
              </div>
              <div class="form-check form-check-inline ms-3">
                <input class="form-check-input" type="checkbox"
                       th:name="${r.authorityCode + '|NODE|' + n.nodeId + '|update'}"
                       th:checked="${nodePerm[r.authorityCode] != null and nodePerm[r.authorityCode].get(n.nodeId) != null and nodePerm[r.authorityCode].get(n.nodeId).canManageStore == true}">
                <label class="form-check-label">更新</label>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-end">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 権限を保存</button>
      </div>
    </div>
  </form>
</div>
</body>
</html>
